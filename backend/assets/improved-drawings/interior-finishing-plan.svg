<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <pattern id="floor-tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f0ebe0" stroke="#ddd8cc" stroke-width="0.8"/>
    </pattern>
    <pattern id="wall-tile" width="20" height="25" patternUnits="userSpaceOnUse">
      <rect width="20" height="25" fill="#e8f0f8" stroke="#c8d8e8" stroke-width="0.6"/>
    </pattern>
    <pattern id="wood-floor" width="30" height="120" patternUnits="userSpaceOnUse">
      <rect width="30" height="120" fill="#c8963c" stroke="#a07028" stroke-width="0.6"/>
      <rect width="30" height="60" fill="#d4a050"/>
    </pattern>
    <filter id="ds" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>
  </defs>

  <rect width="1600" height="1050" fill="#faf9f5"/>
  <rect x="0" y="960" width="1600" height="90" fill="#1a2744"/>
  <rect x="0" y="952" width="1600" height="8" fill="#c8a400"/>
  <rect x="20" y="20" width="1560" height="932" fill="none" stroke="#1a2744" stroke-width="3"/>
  <rect x="28" y="28" width="1544" height="916" fill="none" stroke="#1a2744" stroke-width="1"/>

  <text x="800" y="60" font-family="Arial Black,Arial" font-size="26" font-weight="bold" fill="#1a2744" text-anchor="middle" letter-spacing="2">INTERIOR FINISHING PLAN</text>
  <text x="800" y="82" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">HOUSE BUILDING PROJECT — Drawing No. HBP-IF-006 — Scale 1:50</text>

  <!-- ══ BUILDING OUTLINE ══ -->
  <rect x="100" y="100" width="1200" height="760" fill="none" stroke="#1a2744" stroke-width="5"/>

  <!-- ══ ROOM FLOORS (coloured fill = material) ══ -->
  <!-- Living Room - vitrified tile -->
  <rect x="102" y="102" width="438" height="416" fill="url(#floor-tile)"/>
  <rect x="102" y="102" width="438" height="416" fill="#e8f4e8" opacity="0.5"/>

  <!-- Dining - vitrified tile -->
  <rect x="540" y="102" width="338" height="416" fill="url(#floor-tile)"/>
  <rect x="540" y="102" width="338" height="416" fill="#e8eef8" opacity="0.5"/>

  <!-- Master Bedroom - wooden laminate -->
  <rect x="878" y="102" width="420" height="416" fill="url(#wood-floor)"/>
  <rect x="878" y="102" width="420" height="416" fill="#f0e0c8" opacity="0.5"/>

  <!-- Kitchen - anti-skid ceramic -->
  <rect x="102" y="518" width="286" height="340" fill="url(#wall-tile)"/>
  <rect x="102" y="518" width="286" height="340" fill="#fef5e0" opacity="0.6"/>

  <!-- Toilet 1 - anti-skid ceramic -->
  <rect x="388" y="518" width="200" height="160" fill="url(#wall-tile)"/>
  <rect x="388" y="518" width="200" height="160" fill="#e0f5f5" opacity="0.7"/>

  <!-- Bathroom - anti-skid ceramic -->
  <rect x="388" y="678" width="200" height="180" fill="url(#wall-tile)"/>
  <rect x="388" y="678" width="200" height="180" fill="#d8eeff" opacity="0.7"/>

  <!-- Bedroom 2 - wooden laminate -->
  <rect x="588" y="518" width="300" height="340" fill="url(#wood-floor)"/>
  <rect x="588" y="518" width="300" height="340" fill="#fff0e8" opacity="0.5"/>

  <!-- Bedroom 3 - wooden laminate -->
  <rect x="888" y="518" width="210" height="340" fill="url(#wood-floor)"/>
  <rect x="888" y="518" width="210" height="340" fill="#fff0e8" opacity="0.5"/>

  <!-- Utility -->
  <rect x="1098" y="518" width="200" height="340" fill="#e8e8e8" opacity="0.8"/>

  <!-- ══ ROOM WALLS (lines) ══ -->
  <line x1="540" y1="100" x2="540" y2="518" stroke="#1a2744" stroke-width="4"/>
  <line x1="878" y1="100" x2="878" y2="518" stroke="#1a2744" stroke-width="4"/>
  <line x1="100" y1="518" x2="1300" y2="518" stroke="#1a2744" stroke-width="4"/>
  <line x1="388" y1="518" x2="388" y2="858" stroke="#1a2744" stroke-width="4"/>
  <line x1="588" y1="518" x2="588" y2="858" stroke="#1a2744" stroke-width="4"/>
  <line x1="888" y1="518" x2="888" y2="858" stroke="#1a2744" stroke-width="4"/>
  <line x1="1098" y1="518" x2="1098" y2="858" stroke="#1a2744" stroke-width="4"/>
  <line x1="388" y1="678" x2="588" y2="678" stroke="#1a2744" stroke-width="3"/>

  <!-- ══ ROOM LABELS + FINISH TAGS ══ -->
  <!-- Living Room -->
  <text x="320" y="260" font-family="Arial" font-size="15" font-weight="bold" fill="#1a5c1a" text-anchor="middle">LIVING ROOM</text>
  <rect x="210" y="270" width="220" height="55" rx="4" fill="white" stroke="#1a5c1a" stroke-width="1.5"/>
  <text x="320" y="285" font-family="Arial" font-size="10" fill="#1a5c1a" text-anchor="middle">Floor: 600×600 Vitrified Tile</text>
  <text x="320" y="298" font-family="Arial" font-size="10" fill="#1a5c1a" text-anchor="middle">Wall: Acrylic emulsion paint</text>
  <text x="320" y="311" font-family="Arial" font-size="10" fill="#1a5c1a" text-anchor="middle">Ceiling: POP 2-coat OBD</text>
  <text x="320" y="324" font-family="Arial" font-size="10" fill="#1a5c1a" text-anchor="middle">Skirting: 100mm marble</text>

  <!-- Dining -->
  <text x="709" y="255" font-family="Arial" font-size="15" font-weight="bold" fill="#1a2c6a" text-anchor="middle">DINING</text>
  <rect x="600" y="265" width="218" height="55" rx="4" fill="white" stroke="#1a2c6a" stroke-width="1.5"/>
  <text x="709" y="280" font-family="Arial" font-size="10" fill="#1a2c6a" text-anchor="middle">Floor: 600×600 Vitrified Tile</text>
  <text x="709" y="293" font-family="Arial" font-size="10" fill="#1a2c6a" text-anchor="middle">Wall: Acrylic emulsion paint</text>
  <text x="709" y="306" font-family="Arial" font-size="10" fill="#1a2c6a" text-anchor="middle">Ceiling: POP 2-coat OBD</text>
  <text x="709" y="319" font-family="Arial" font-size="10" fill="#1a2c6a" text-anchor="middle">Skirting: 100mm marble</text>

  <!-- Master Bedroom -->
  <text x="1088" y="230" font-family="Arial" font-size="14" font-weight="bold" fill="#5a1a7a" text-anchor="middle">MASTER BED</text>
  <rect x="968" y="240" width="240" height="55" rx="4" fill="white" stroke="#5a1a7a" stroke-width="1.5"/>
  <text x="1088" y="255" font-family="Arial" font-size="10" fill="#5a1a7a" text-anchor="middle">Floor: 12mm Eng. Wooden</text>
  <text x="1088" y="268" font-family="Arial" font-size="10" fill="#5a1a7a" text-anchor="middle">Wall: Texture + OBD</text>
  <text x="1088" y="281" font-family="Arial" font-size="10" fill="#5a1a7a" text-anchor="middle">Ceiling: Gypsum + cove</text>
  <text x="1088" y="294" font-family="Arial" font-size="10" fill="#5a1a7a" text-anchor="middle">Skirting: 100mm tile</text>

  <!-- Kitchen -->
  <text x="245" y="620" font-family="Arial" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">KITCHEN</text>
  <rect x="110" y="630" width="265" height="70" rx="4" fill="white" stroke="#7a4a00" stroke-width="1.5"/>
  <text x="245" y="645" font-family="Arial" font-size="10" fill="#7a4a00" text-anchor="middle">Floor: 300×300 Anti-skid</text>
  <text x="245" y="658" font-family="Arial" font-size="10" fill="#7a4a00" text-anchor="middle">Wall: 600mm dado ceramic tile</text>
  <text x="245" y="671" font-family="Arial" font-size="10" fill="#7a4a00" text-anchor="middle">Ceiling: Moisture OBD</text>
  <text x="245" y="684" font-family="Arial" font-size="10" fill="#7a4a00" text-anchor="middle">Counter: 18mm granite</text>
  <text x="245" y="697" font-family="Arial" font-size="10" fill="#7a4a00" text-anchor="middle">Cabinets: 18mm BWR ply</text>

  <!-- Toilet -->
  <text x="488" y="548" font-family="Arial" font-size="11" font-weight="bold" fill="#006060" text-anchor="middle">TOILET</text>
  <text x="488" y="562" font-family="Arial" font-size="9" fill="#006060" text-anchor="middle">Anti-skid ceramic</text>
  <text x="488" y="575" font-family="Arial" font-size="9" fill="#006060" text-anchor="middle">Full-ht wall tile</text>

  <!-- Bathroom -->
  <text x="488" y="710" font-family="Arial" font-size="11" font-weight="bold" fill="#00408a" text-anchor="middle">BATH</text>
  <text x="488" y="724" font-family="Arial" font-size="9" fill="#00408a" text-anchor="middle">Anti-skid ceramic</text>
  <text x="488" y="737" font-family="Arial" font-size="9" fill="#00408a" text-anchor="middle">Full-ht wall tile</text>

  <!-- Bedroom 2 -->
  <text x="738" y="620" font-family="Arial" font-size="14" font-weight="bold" fill="#7a2000" text-anchor="middle">BEDROOM 2</text>
  <rect x="630" y="630" width="216" height="55" rx="4" fill="white" stroke="#7a2000" stroke-width="1.5"/>
  <text x="738" y="645" font-family="Arial" font-size="10" fill="#7a2000" text-anchor="middle">Floor: 12mm Eng. Wooden</text>
  <text x="738" y="658" font-family="Arial" font-size="10" fill="#7a2000" text-anchor="middle">Wall: Acrylic emulsion OBD</text>
  <text x="738" y="671" font-family="Arial" font-size="10" fill="#7a2000" text-anchor="middle">Ceiling: POP smooth finish</text>
  <text x="738" y="684" font-family="Arial" font-size="10" fill="#7a2000" text-anchor="middle">Skirting: 100mm tile</text>

  <!-- Bedroom 3 -->
  <text x="993" y="620" font-family="Arial" font-size="14" font-weight="bold" fill="#7a2000" text-anchor="middle">BEDROOM 3</text>
  <rect x="892" y="630" width="202" height="55" rx="4" fill="white" stroke="#7a2000" stroke-width="1.5"/>
  <text x="993" y="645" font-family="Arial" font-size="10" fill="#7a2000" text-anchor="middle">Floor: 12mm Eng. Wooden</text>
  <text x="993" y="658" font-family="Arial" font-size="10" fill="#7a2000" text-anchor="middle">Wall: Acrylic emulsion OBD</text>
  <text x="993" y="671" font-family="Arial" font-size="10" fill="#7a2000" text-anchor="middle">Ceiling: POP smooth finish</text>
  <text x="993" y="684" font-family="Arial" font-size="10" fill="#7a2000" text-anchor="middle">Skirting: 100mm tile</text>

  <!-- Utility -->
  <text x="1199" y="680" font-family="Arial" font-size="11" font-weight="bold" fill="#444" text-anchor="middle">UTILITY</text>
  <text x="1199" y="696" font-family="Arial" font-size="9" fill="#444" text-anchor="middle">Screed finish</text>
  <text x="1199" y="710" font-family="Arial" font-size="9" fill="#444" text-anchor="middle">Cement paint</text>

  <!-- ══ CEILING HEIGHT CALLOUTS ══ -->
  <text x="320" y="450" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">CH: 3000mm</text>
  <text x="709" y="450" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">CH: 3000mm</text>
  <text x="1088" y="450" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">CH: 3000mm</text>
  <text x="245" y="810" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">CH: 2700mm</text>
  <text x="738" y="810" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">CH: 2800mm</text>
  <text x="993" y="810" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">CH: 2800mm</text>

  <!-- ══ LEGEND ══ -->
  <rect x="1330" y="100" width="240" height="580" rx="6" fill="white" stroke="#1a2744" stroke-width="2" filter="url(#ds)"/>
  <text x="1450" y="120" font-family="Arial Black" font-size="13" fill="#1a2744" text-anchor="middle">FINISH LEGEND</text>
  <line x1="1340" y1="128" x2="1560" y2="128" stroke="#1a2744" stroke-width="1"/>

  <!-- Vitrified tile -->
  <rect x="1345" y="140" width="30" height="22" fill="url(#floor-tile)" stroke="#999" stroke-width="1"/>
  <rect x="1345" y="140" width="30" height="22" fill="#e8f4e8" opacity="0.5"/>
  <text x="1382" y="156" font-family="Arial" font-size="11" fill="#333">Vitrified tile (600×600)</text>

  <!-- Wood -->
  <rect x="1345" y="172" width="30" height="22" fill="url(#wood-floor)" stroke="#999" stroke-width="1"/>
  <rect x="1345" y="172" width="30" height="22" fill="#f0e0c8" opacity="0.5"/>
  <text x="1382" y="188" font-family="Arial" font-size="11" fill="#333">Eng. Wood (12mm)</text>

  <!-- Anti-skid tile -->
  <rect x="1345" y="204" width="30" height="22" fill="url(#wall-tile)" stroke="#999" stroke-width="1"/>
  <rect x="1345" y="204" width="30" height="22" fill="#e0f5f5" opacity="0.7"/>
  <text x="1382" y="220" font-family="Arial" font-size="11" fill="#333">Anti-skid ceramic</text>

  <text x="1345" y="248" font-family="Arial Black" font-size="11" fill="#1a2744">PAINT SCHEDULE</text>
  <line x1="1340" y1="254" x2="1560" y2="254" stroke="#ccc" stroke-width="1"/>
  <text x="1345" y="270" font-family="Arial" font-size="10" fill="#333">Interior: 2 coats primer</text>
  <text x="1345" y="284" font-family="Arial" font-size="10" fill="#333">  + 2 coats acrylic OBD.</text>
  <text x="1345" y="300" font-family="Arial" font-size="10" fill="#333">Exterior: Weather shield</text>
  <text x="1345" y="314" font-family="Arial" font-size="10" fill="#333">  elastomeric texture.</text>
  <text x="1345" y="330" font-family="Arial" font-size="10" fill="#333">Wet areas: Moisture</text>
  <text x="1345" y="344" font-family="Arial" font-size="10" fill="#333">  resistant OBD.</text>
  <text x="1345" y="360" font-family="Arial" font-size="10" fill="#333">Ceiling: POP/gypsum,</text>
  <text x="1345" y="374" font-family="Arial" font-size="10" fill="#333">  white 2-coat distemper.</text>

  <text x="1345" y="398" font-family="Arial Black" font-size="11" fill="#1a2744">TILE SCHEDULE</text>
  <line x1="1340" y1="404" x2="1560" y2="404" stroke="#ccc" stroke-width="1"/>
  <text x="1345" y="420" font-family="Arial" font-size="10" fill="#333">Living/Dining:</text>
  <text x="1345" y="434" font-family="Arial" font-size="10" fill="#333">  600×600 Pgvt double</text>
  <text x="1345" y="448" font-family="Arial" font-size="10" fill="#333">  charge vitrified.</text>
  <text x="1345" y="464" font-family="Arial" font-size="10" fill="#333">Bedrooms:</text>
  <text x="1345" y="478" font-family="Arial" font-size="10" fill="#333">  12mm eng. laminated</text>
  <text x="1345" y="492" font-family="Arial" font-size="10" fill="#333">  hardwood flooring.</text>
  <text x="1345" y="508" font-family="Arial" font-size="10" fill="#333">Wet areas (floor):</text>
  <text x="1345" y="522" font-family="Arial" font-size="10" fill="#333">  300×300 anti-skid</text>
  <text x="1345" y="536" font-family="Arial" font-size="10" fill="#333">  ceramic IS 13630.</text>
  <text x="1345" y="552" font-family="Arial" font-size="10" fill="#333">Wet areas (wall):</text>
  <text x="1345" y="566" font-family="Arial" font-size="10" fill="#333">  300×450 glazed cer.</text>
  <text x="1345" y="580" font-family="Arial" font-size="10" fill="#333">  ht. 2100mm (full).</text>
  <text x="1345" y="596" font-family="Arial" font-size="10" fill="#333">Kitchen dado:</text>
  <text x="1345" y="610" font-family="Arial" font-size="10" fill="#333">  600×300 designer cer.</text>
  <text x="1345" y="626" font-family="Arial" font-size="10" fill="#333">  ht. 600mm from ctop.</text>
  <text x="1345" y="644" font-family="Arial" font-size="10" fill="#b00000">Grout: Epoxy, joint 2mm.</text>
  <text x="1345" y="658" font-family="Arial" font-size="10" fill="#b00000">Waterproofing under</text>
  <text x="1345" y="672" font-family="Arial" font-size="10" fill="#b00000">all wet area tiles.</text>

  <!-- Notes -->
  <rect x="1330" y="698" width="240" height="244" rx="6" fill="white" stroke="#1a2744" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1450" y="718" font-family="Arial Black" font-size="11" fill="#1a2744" text-anchor="middle">GEN. NOTES</text>
  <text x="1340" y="736" font-family="Arial" font-size="10" fill="#333">1. All tile: CM 1:3 fix.</text>
  <text x="1340" y="750" font-family="Arial" font-size="10" fill="#333">2. Skirting: 100mm ht.</text>
  <text x="1340" y="764" font-family="Arial" font-size="10" fill="#333">3. Doors: teak frame,</text>
  <text x="1340" y="778" font-family="Arial" font-size="10" fill="#333">   flush shutter HDF.</text>
  <text x="1340" y="792" font-family="Arial" font-size="10" fill="#333">4. Windows: UPVC 5tr.</text>
  <text x="1340" y="806" font-family="Arial" font-size="10" fill="#333">5. Ceiling ht: as marked.</text>
  <text x="1340" y="820" font-family="Arial" font-size="10" fill="#333">6. POP punning 12mm.</text>
  <text x="1340" y="834" font-family="Arial" font-size="10" fill="#333">7. Wardrobes: MBed</text>
  <text x="1340" y="848" font-family="Arial" font-size="10" fill="#333">   &amp; Bed2 — 18mm MDF.</text>
  <text x="1340" y="862" font-family="Arial" font-size="10" fill="#333">8. Kitchen: modular</text>
  <text x="1340" y="876" font-family="Arial" font-size="10" fill="#333">   cabinets, 18mm BWR.</text>
  <text x="1340" y="892" font-family="Arial" font-size="10" fill="#b00000">9. IS 1543 &amp; NBC 2016.</text>
  <text x="1340" y="906" font-family="Arial" font-size="10" fill="#b00000">10. Waterproof: IS 2645.</text>
  <text x="1340" y="922" font-family="Arial" font-size="10" fill="#333">11. All dims to be</text>
  <text x="1340" y="936" font-family="Arial" font-size="10" fill="#333">    verified on site.</text>

  <!-- Title block -->
  <text x="24" y="988" font-family="Arial Black,Arial" font-size="20" font-weight="bold" fill="white">INTERIOR FINISHING PLAN</text>
