  <text x="1500" y="530" font-family="Arial Black" font-size="11" fill="#1a2744" text-anchor="middle">NOTES</text>
  <text x="1430" y="550" font-family="Arial" font-size="10" fill="#333">1. All dims in mm.</text>
  <text x="1430" y="566" font-family="Arial" font-size="10" fill="#333">2. M10 PCC blinding,</text>
  <text x="1430" y="580" font-family="Arial" font-size="10" fill="#333">   100mm thick.</text>
  <text x="1430" y="596" font-family="Arial" font-size="10" fill="#333">3. M25 RCC for all</text>
  <text x="1430" y="610" font-family="Arial" font-size="10" fill="#333">   footings &amp; beams.</text>
  <text x="1430" y="626" font-family="Arial" font-size="10" fill="#333">4. Anti-termite treat-</text>
  <text x="1430" y="640" font-family="Arial" font-size="10" fill="#333">   ment before PCC.</text>
  <text x="1430" y="656" font-family="Arial" font-size="10" fill="#333">5. Backfill in layers,</text>
  <text x="1430" y="670" font-family="Arial" font-size="10" fill="#333">   compact to 95%.</text>
  <text x="1430" y="686" font-family="Arial" font-size="10" fill="#333">6. Plinth beam:</text>
  <text x="1430" y="700" font-family="Arial" font-size="10" fill="#333">   230×300mm.</text>
  <text x="1430" y="716" font-family="Arial" font-size="10" fill="#333">7. Cover 50mm all.</text>
  <text x="1430" y="732" font-family="Arial" font-size="10" fill="#333">8. Footing depth:</text>
  <text x="1430" y="746" font-family="Arial" font-size="10" fill="#333">   1500mm BGL.</text>
  <text x="1430" y="762" font-family="Arial" font-size="10" fill="#333">9. IS 456:2000 governs</text>
  <text x="1430" y="778" font-family="Arial" font-size="10" fill="#333">   all RCC work.</text>
  <text x="1430" y="794" font-family="Arial" font-size="10" fill="#b00000">10. Verify SBC with</text>
  <text x="1430" y="808" font-family="Arial" font-size="10" fill="#b00000">    soil test report.</text>

