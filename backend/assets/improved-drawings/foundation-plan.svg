  <text x="1500" y="393" font-family="Arial" font-size="9" fill="#444" text-anchor="middle">Cover: 50mm min</text>
  <text x="1500" y="408" font-family="Arial" font-size="9" fill="#444" text-anchor="middle">Column: 230×230mm</text>
  <text x="1500" y="425" font-family="Arial" font-size="9" fill="#444" text-anchor="middle">4-12φ + Links 8φ@150</text>
  <text x="1500" y="450" font-family="Arial" font-size="9" fill="#b00000" text-anchor="middle" font-weight="bold">SBC: 150 kN/m²</text>
