<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <filter id="ds" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>
  </defs>

  <rect width="1600" height="1050" fill="#f0f8ff"/>
  <rect x="0" y="960" width="1600" height="90" fill="#1a2744"/>
  <rect x="0" y="952" width="1600" height="8" fill="#c8a400"/>
  <rect x="20" y="20" width="1560" height="932" fill="none" stroke="#1a2744" stroke-width="3"/>
  <rect x="28" y="28" width="1544" height="916" fill="none" stroke="#1a2744" stroke-width="1"/>

  <text x="800" y="60" font-family="Arial Black,Arial" font-size="26" font-weight="bold" fill="#1a2744" text-anchor="middle" letter-spacing="2">PLUMBING &amp; DRAINAGE PLAN</text>
  <text x="800" y="82" font-family="Arial" font-size="13" fill="#555" text-anchor="middle">HOUSE BUILDING PROJECT — Drawing No. HBP-PL-005 — Scale 1:50</text>

  <!-- ══ BUILDING OUTLINE ══ -->
  <rect x="100" y="100" width="1200" height="760" fill="#f8fdff" stroke="#1a2744" stroke-width="5"/>

  <!-- Room walls -->
  <line x1="540" y1="100" x2="540" y2="520" stroke="#1a2744" stroke-width="4"/>
  <line x1="880" y1="100" x2="880" y2="520" stroke="#1a2744" stroke-width="4"/>
  <line x1="100" y1="520" x2="1300" y2="520" stroke="#1a2744" stroke-width="4"/>
  <line x1="390" y1="520" x2="390" y2="860" stroke="#1a2744" stroke-width="4"/>
  <line x1="590" y1="520" x2="590" y2="860" stroke="#1a2744" stroke-width="4"/>
  <line x1="890" y1="520" x2="890" y2="860" stroke="#1a2744" stroke-width="4"/>
  <line x1="1100" y1="520" x2="1100" y2="860" stroke="#1a2744" stroke-width="4"/>
  <line x1="390" y1="680" x2="590" y2="680" stroke="#1a2744" stroke-width="3"/>

  <!-- Room labels -->
  <text x="320" y="310" font-family="Arial" font-size="12" fill="#bbb" text-anchor="middle">LIVING ROOM</text>
  <text x="710" y="310" font-family="Arial" font-size="12" fill="#bbb" text-anchor="middle">DINING</text>
  <text x="1090" y="310" font-family="Arial" font-size="12" fill="#bbb" text-anchor="middle">MASTER BED</text>
  <text x="245" y="690" font-family="Arial" font-size="12" fill="#bbb" text-anchor="middle">KITCHEN</text>
  <text x="490" y="590" font-family="Arial" font-size="11" fill="#bbb" text-anchor="middle">TOILET</text>
  <text x="490" y="750" font-family="Arial" font-size="11" fill="#bbb" text-anchor="middle">BATH</text>
  <text x="740" y="690" font-family="Arial" font-size="12" fill="#bbb" text-anchor="middle">BEDROOM 2</text>
  <text x="995" y="690" font-family="Arial" font-size="12" fill="#bbb" text-anchor="middle">BEDROOM 3</text>

  <!-- ══ WATER SUPPLY LINES (blue, solid) ══ -->
  <!-- Main supply horizontal spine from OHT -->
  <line x1="100" y1="130" x2="1300" y2="130" stroke="#2563eb" stroke-width="4"/>
  <!-- Vertical drops to wet areas -->
  <line x1="490" y1="130" x2="490" y2="750" stroke="#2563eb" stroke-width="3"/>
  <line x1="245" y1="130" x2="245" y2="600" stroke="#2563eb" stroke-width="3"/>
  <line x1="1050" y1="130" x2="1050" y2="400" stroke="#2563eb" stroke-width="3"/>
  <!-- Hot water supply (lighter blue) from geyser -->
  <line x1="490" y1="400" x2="1050" y2="400" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="10,4"/>
  <line x1="760" y1="400" x2="760" y2="600" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="10,4"/>

  <!-- ══ DRAINAGE LINES (green, dashed) ══ -->
  <!-- Main soil stack vertical -->
  <line x1="490" y1="520" x2="490" y2="860" stroke="#16a34a" stroke-width="5" stroke-dasharray="14,5"/>
  <!-- Horizontal drain runs -->
  <line x1="100" y1="850" x2="490" y2="850" stroke="#16a34a" stroke-width="4" stroke-dasharray="12,5"/>
  <line x1="490" y1="850" x2="1300" y2="850" stroke="#16a34a" stroke-width="3" stroke-dasharray="12,5"/>
  <!-- Kitchen drain -->
  <line x1="245" y1="780" x2="245" y2="850" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Master bath drain -->
  <line x1="1050" y1="520" x2="1050" y2="850" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- External to sump -->
  <line x1="490" y1="860" x2="490" y2="940" stroke="#16a34a" stroke-width="4" stroke-dasharray="10,5"/>
  <line x1="490" y1="940" x2="200" y2="940" stroke="#16a34a" stroke-width="4" stroke-dasharray="10,5"/>

  <!-- ══ PLUMBING FIXTURES ══ -->
  <!-- Toilet 1 - WC -->
  <ellipse cx="490" cy="600" rx="28" ry="36" fill="white" stroke="#1d4ed8" stroke-width="2.5"/>
  <ellipse cx="490" cy="584" rx="13" ry="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="490" y="648" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">WC1</text>

  <!-- Bathroom - WC -->
  <ellipse cx="490" cy="780" rx="28" ry="36" fill="white" stroke="#1d4ed8" stroke-width="2.5"/>
  <ellipse cx="490" cy="764" rx="13" ry="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="490" y="828" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">WC2</text>

  <!-- Bath tub -->
  <rect x="408" y="710" width="70" height="130" rx="10" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="415" y="717" width="56" height="116" rx="8" fill="#dbeafe"/>
  <circle cx="441" cy="730" r="5" fill="#1d4ed8"/>
  <text x="443" y="795" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle">TUB</text>

  <!-- Toilet 1 wash basin -->
  <rect x="528" y="540" width="50" height="36" rx="8" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="534" y="546" width="38" height="24" rx="5" fill="#dbeafe"/>
  <circle cx="553" cy="558" r="5" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="553" y="592" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle">BASIN1</text>

  <!-- Bath wash basin -->
  <rect x="528" y="700" width="50" height="36" rx="8" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="534" y="706" width="38" height="24" rx="5" fill="#dbeafe"/>
  <circle cx="553" cy="718" r="5" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="553" y="752" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle">BASIN2</text>

  <!-- Shower in bathroom -->
  <rect x="408" y="640" width="60" height="60" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="438" cy="670" r="14" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="430" y1="656" x2="446" y2="684" stroke="#1d4ed8" stroke-width="1"/>
  <line x1="446" y1="656" x2="430" y2="684" stroke="#1d4ed8" stroke-width="1"/>
  <text x="438" y="714" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle">SHWR</text>

  <!-- Master bed bathroom -->
  <!-- WC -->
  <ellipse cx="1050" cy="280" rx="24" ry="30" fill="white" stroke="#1d4ed8" stroke-width="2.5"/>
  <ellipse cx="1050" cy="267" rx="11" ry="9" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1050" y="320" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">WC3</text>
  <!-- Basin -->
  <rect x="1100" y="120" width="48" height="34" rx="7" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="1106" y="126" width="36" height="22" rx="5" fill="#dbeafe"/>
  <circle cx="1124" cy="137" r="5" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1124" y="168" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle">BASIN3</text>
  <!-- Shower master -->
  <rect x="1150" y="160" width="55" height="55" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="1177" cy="187" r="12" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1177" y="228" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle">SHWR2</text>

  <!-- Kitchen sink -->
  <rect x="168" y="540" width="80" height="48" rx="5" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="172" y="544" width="34" height="38" rx="3" fill="#dbeafe"/>
  <rect x="210" y="544" width="34" height="38" rx="3" fill="#dbeafe"/>
  <circle cx="208" cy="563" r="4" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="208" y="602" font-family="Arial" font-size="10" fill="#1d4ed8" text-anchor="middle">K.SINK</text>

  <!-- Overhead Tank indicator -->
  <rect x="1150" y="108" width="110" height="50" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="1205" y="128" font-family="Arial Black" font-size="11" fill="#1e3a8a" text-anchor="middle">OHT</text>
  <text x="1205" y="144" font-family="Arial" font-size="9" fill="#1e3a8a" text-anchor="middle">1000L HDPE</text>
  <line x1="1205" y1="158" x2="1205" y2="130" stroke="#2563eb" stroke-width="3"/>

  <!-- Underground sump -->
  <rect x="140" y="890" width="110" height="50" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="195" y="910" font-family="Arial Black" font-size="11" fill="#065f46" text-anchor="middle">SUMP</text>
  <text x="195" y="926" font-family="Arial" font-size="9" fill="#065f46" text-anchor="middle">15000L UG</text>

  <!-- Geyser (water heater) -->
  <circle cx="760" cy="350" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="760" y="345" font-family="Arial Black" font-size="11" fill="#92400e" text-anchor="middle">GEY</text>
  <text x="760" y="360" font-family="Arial" font-size="9" fill="#92400e" text-anchor="middle">25L EW</text>
  <text x="760" y="394" font-family="Arial" font-size="9" fill="#d97706" text-anchor="middle">GEYSER</text>

  <!-- ══ LEGEND ══ -->
  <rect x="1330" y="100" width="240" height="560" rx="6" fill="white" stroke="#1d4ed8" stroke-width="2" filter="url(#ds)"/>
  <text x="1450" y="122" font-family="Arial Black" font-size="13" fill="#1a2744" text-anchor="middle">LEGEND</text>
  <line x1="1340" y1="130" x2="1560" y2="130" stroke="#1d4ed8" stroke-width="1"/>

  <!-- Supply main -->
  <line x1="1345" y1="152" x2="1390" y2="152" stroke="#2563eb" stroke-width="4"/>
  <text x="1400" y="157" font-family="Arial" font-size="12" fill="#333">Cold water supply</text>

  <!-- Hot water -->
  <line x1="1345" y1="178" x2="1390" y2="178" stroke="#60a5fa" stroke-width="3" stroke-dasharray="8,3"/>
  <text x="1400" y="183" font-family="Arial" font-size="12" fill="#333">Hot water supply</text>

  <!-- Drain -->
  <line x1="1345" y1="204" x2="1390" y2="204" stroke="#16a34a" stroke-width="4" stroke-dasharray="10,4"/>
  <text x="1400" y="209" font-family="Arial" font-size="12" fill="#333">Drainage / soil</text>

  <!-- WC -->
  <ellipse cx="1362" cy="238" rx="14" ry="18" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1400" y="243" font-family="Arial" font-size="12" fill="#333">WC / Water Closet</text>

  <!-- Wash basin -->
  <rect x="1350" y="268" width="24" height="18" rx="4" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1400" y="281" font-family="Arial" font-size="12" fill="#333">Wash Basin</text>

  <!-- Shower -->
  <circle cx="1362" cy="312" r="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1400" y="317" font-family="Arial" font-size="12" fill="#333">Shower</text>

  <!-- Kitchen sink -->
  <rect x="1349" y="335" width="28" height="20" rx="3" fill="white" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="1363" y1="335" x2="1363" y2="355" stroke="#1d4ed8" stroke-width="1"/>
  <text x="1400" y="350" font-family="Arial" font-size="12" fill="#333">Kitchen Sink</text>

  <!-- Tub -->
  <rect x="1349" y="368" width="28" height="18" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1400" y="382" font-family="Arial" font-size="12" fill="#333">Bath Tub</text>

  <!-- Geyser -->
  <circle cx="1362" cy="408" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1362" y="412" font-family="Arial" font-size="9" fill="#92400e" text-anchor="middle">GEY</text>
  <text x="1400" y="413" font-family="Arial" font-size="12" fill="#333">Geyser / Heater</text>

  <!-- OHT -->
  <rect x="1348" y="432" width="28" height="22" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1362" y="447" font-family="Arial" font-size="9" fill="#1e3a8a" text-anchor="middle">OHT</text>
  <text x="1400" y="450" font-family="Arial" font-size="12" fill="#333">Overhead Tank</text>

  <!-- Sump -->
  <rect x="1348" y="466" width="28" height="22" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="1362" y="481" font-family="Arial" font-size="9" fill="#065f46" text-anchor="middle">SMP</text>
  <text x="1400" y="484" font-family="Arial" font-size="12" fill="#333">Underground Sump</text>

  <!-- Valve -->
  <polygon points="1350,517 1374,510 1374,524" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <polygon points="1374,517 1350,510 1350,524" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <text x="1400" y="521" font-family="Arial" font-size="12" fill="#333">Gate Valve</text>

  <!-- Ball valve -->
  <line x1="1350" y1="545" x2="1374" y2="545" stroke="#2563eb" stroke-width="2"/>
  <circle cx="1362" cy="545" r="7" fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="1400" y="550" font-family="Arial" font-size="12" fill="#333">Ball / Stop Cock</text>

  <!-- Notes panel -->
  <rect x="1330" y="680" width="240" height="262" rx="6" fill="white" stroke="#1a2744" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1450" y="700" font-family="Arial Black" font-size="11" fill="#1a2744" text-anchor="middle">NOTES</text>
  <text x="1340" y="718" font-family="Arial" font-size="10" fill="#333">1. Supply: CPVC 25mm</text>
  <text x="1340" y="732" font-family="Arial" font-size="10" fill="#333">   PN16 all wet areas.</text>
  <text x="1340" y="748" font-family="Arial" font-size="10" fill="#333">2. Drainage: 110mm</text>
  <text x="1340" y="762" font-family="Arial" font-size="10" fill="#333">   uPVC soil pipe.</text>
  <text x="1340" y="778" font-family="Arial" font-size="10" fill="#333">3. Waste: 50mm uPVC</text>
  <text x="1340" y="792" font-family="Arial" font-size="10" fill="#333">   to floor traps.</text>
  <text x="1340" y="808" font-family="Arial" font-size="10" fill="#333">4. All joints: solvent</text>
  <text x="1340" y="822" font-family="Arial" font-size="10" fill="#333">   weld. Test at 1.5x.</text>
  <text x="1340" y="838" font-family="Arial" font-size="10" fill="#b00000">5. IS 12818 (CPVC)</text>
  <text x="1340" y="852" font-family="Arial" font-size="10" fill="#b00000">   IS 4985 (uPVC).</text>
  <text x="1340" y="868" font-family="Arial" font-size="10" fill="#333">6. Vent pipe: 75mm,</text>
  <text x="1340" y="882" font-family="Arial" font-size="10" fill="#333">   150mm above roof.</text>
  <text x="1340" y="898" font-family="Arial" font-size="10" fill="#333">7. Sump pump: 0.5HP</text>
  <text x="1340" y="912" font-family="Arial" font-size="10" fill="#333">   submersible, auto.</text>
  <text x="1340" y="928" font-family="Arial" font-size="10" fill="#333">8. Slope: 1:80 min.</text>

  <!-- Gate valves at key points -->
  <polygon points="243,370 256,363 256,377" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <polygon points="256,370 243,363 243,377" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <polygon points="488,290 501,283 501,297" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <polygon points="501,290 488,283 488,297" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>

  <!-- Title block -->
  <text x="24" y="988" font-family="Arial Black,Arial" font-size="20" font-weight="bold" fill="white">PLUMBING &amp; DRAINAGE PLAN</text>
