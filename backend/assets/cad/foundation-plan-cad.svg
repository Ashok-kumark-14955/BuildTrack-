<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     style="background:#f8f8f2;font-family:'Courier New',monospace;">

  <!-- ═══════════════════════════════════════════════════════════════
       FOUNDATION PLAN — HOUSE BUILDING PROJECT
       Grid: 4 columns (A–D) × 3 rows (1–3)
       Scale: 1:100  |  All dimensions in mm
       ═══════════════════════════════════════════════════════════════ -->

  <defs>
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10,0 L0,0 0,10" fill="none" stroke="#d0d0c0" stroke-width="0.3"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-fine)"/>
      <path d="M100,0 L0,0 0,100" fill="none" stroke="#b8b8a0" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#2c3e50"/>
    </marker>
    <!-- Hatch pattern for concrete footings -->
    <pattern id="footing-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#999980" stroke-width="1.5"/>
    </pattern>
    <!-- Hatch pattern for walls -->
    <pattern id="wall-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#888870" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Drawing background -->
  <rect width="1200" height="900" fill="#f8f8f2"/>

  <!-- Fine grid background -->
  <rect x="80" y="80" width="1040" height="760" fill="url(#grid-major)" opacity="0.5"/>

  <!-- ─── TITLE BLOCK ─── -->
  <rect x="80" y="820" width="1040" height="60" fill="#e8e8d8" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="400" y1="820" x2="400" y2="880" stroke="#2c3e50" stroke-width="1"/>
  <line x1="700" y1="820" x2="700" y2="880" stroke="#2c3e50" stroke-width="1"/>
  <line x1="900" y1="820" x2="900" y2="880" stroke="#2c3e50" stroke-width="1"/>
  <text x="240" y="845" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="middle">PROJECT: HOUSE BUILDING</text>
  <text x="240" y="862" font-size="10" fill="#444" text-anchor="middle">Client: Residential Development</text>
  <text x="550" y="845" font-size="13" font-weight="bold" fill="#1a252f" text-anchor="middle">FOUNDATION PLAN</text>
  <text x="550" y="862" font-size="10" fill="#444" text-anchor="middle">Drawing No: FP-001 | Rev: A</text>
  <text x="800" y="845" font-size="10" fill="#2c3e50" text-anchor="middle">Scale: 1:100</text>
  <text x="800" y="862" font-size="10" fill="#444" text-anchor="middle">Units: mm</text>
  <text x="1000" y="845" font-size="10" fill="#2c3e50" text-anchor="middle">Date: 2026-09-08</text>
  <text x="1000" y="862" font-size="10" fill="#444" text-anchor="middle">Sheet: 1 of 3</text>

  <!-- Border -->
  <rect x="80" y="80" width="1040" height="740" fill="none" stroke="#2c3e50" stroke-width="2"/>

  <!-- ─── GRID LINES (construction lines) ─── -->
  <!-- Vertical grid lines: A(160), B(420), C(680), D(940) -->
  <line x1="160" y1="120" x2="160" y2="760" stroke="#3498db" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.6"/>
  <line x1="420" y1="120" x2="420" y2="760" stroke="#3498db" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.6"/>
  <line x1="680" y1="120" x2="680" y2="760" stroke="#3498db" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.6"/>
  <line x1="940" y1="120" x2="940" y2="760" stroke="#3498db" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.6"/>

  <!-- Horizontal grid lines: 1(160), 2(450), 3(720) -->
  <line x1="100" y1="160" x2="1060" y2="160" stroke="#3498db" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.6"/>
  <line x1="100" y1="450" x2="1060" y2="450" stroke="#3498db" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.6"/>
  <line x1="100" y1="720" x2="1060" y2="720" stroke="#3498db" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.6"/>

  <!-- ─── COLUMN BUBBLES (grid reference circles) ─── -->
  <!-- Row 1 -->
  <circle cx="160" cy="130" r="14" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160" y="135" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">A</text>
  <circle cx="420" cy="130" r="14" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="420" y="135" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">B</text>
  <circle cx="680" cy="130" r="14" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="680" y="135" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">C</text>
  <circle cx="940" cy="130" r="14" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="940" y="135" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">D</text>

  <!-- Row numbers -->
  <circle cx="110" cy="160" r="14" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="110" y="165" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">1</text>
  <circle cx="110" cy="450" r="14" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="110" y="455" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">2</text>
  <circle cx="110" cy="720" r="14" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="110" y="725" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">3</text>

  <!-- ─── FOUNDATION WALLS (outer perimeter) ─── -->
  <!-- Outer wall thickness = 30px (300mm at 1:100) -->
  <!-- Top wall: A1 to D1 -->
  <rect x="145" y="145" width="810" height="30" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="2"/>
  <!-- Bottom wall: A3 to D3 -->
  <rect x="145" y="705" width="810" height="30" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="2"/>
  <!-- Left wall: A1 to A3 -->
  <rect x="145" y="145" width="30" height="590" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="2"/>
  <!-- Right wall: D1 to D3 -->
  <rect x="925" y="145" width="30" height="590" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="2"/>

  <!-- ─── INTERNAL WALLS ─── -->
  <!-- Internal wall B col vertical -->
  <rect x="407" y="175" width="26" height="275" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Internal wall C col vertical -->
  <rect x="667" y="175" width="26" height="275" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Internal horizontal wall row 2 (left half) -->
  <rect x="175" y="437" width="258" height="26" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Internal horizontal wall row 2 (right half) -->
  <rect x="693" y="437" width="232" height="26" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- ─── COLUMN FOOTINGS ─── -->
  <!-- Each footing: 60x60 square with hatch, centred on grid intersection -->
  <!-- A1 -->
  <rect x="130" y="130" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="160" y="165" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F1</text>
  <!-- B1 -->
  <rect x="390" y="130" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="420" y="165" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F2</text>
  <!-- C1 -->
  <rect x="650" y="130" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="680" y="165" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F3</text>
  <!-- D1 -->
  <rect x="910" y="130" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="940" y="165" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F4</text>
  <!-- A2 -->
  <rect x="130" y="420" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="160" y="455" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F5</text>
  <!-- B2 -->
  <rect x="390" y="420" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="420" y="455" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F6</text>
  <!-- C2 -->
  <rect x="650" y="420" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="680" y="455" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F7</text>
  <!-- D2 -->
  <rect x="910" y="420" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="940" y="455" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F8</text>
  <!-- A3 -->
  <rect x="130" y="690" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="160" y="725" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F9</text>
  <!-- B3 -->
  <rect x="390" y="690" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="420" y="725" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F10</text>
  <!-- C3 -->
  <rect x="650" y="690" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="680" y="725" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F11</text>
  <!-- D3 -->
  <rect x="910" y="690" width="60" height="60" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="940" y="725" font-size="8" font-weight="bold" fill="#8B0000" text-anchor="middle">F12</text>

  <!-- Column centre-point crosses -->
  <line x1="150" y1="160" x2="170" y2="160" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="160" y1="150" x2="160" y2="170" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="410" y1="160" x2="430" y2="160" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="420" y1="150" x2="420" y2="170" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="670" y1="160" x2="690" y2="160" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="680" y1="150" x2="680" y2="170" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="930" y1="160" x2="950" y2="160" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="940" y1="150" x2="940" y2="170" stroke="#cc0000" stroke-width="1.5"/>

  <line x1="150" y1="450" x2="170" y2="450" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="160" y1="440" x2="160" y2="460" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="410" y1="450" x2="430" y2="450" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="420" y1="440" x2="420" y2="460" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="670" y1="450" x2="690" y2="450" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="680" y1="440" x2="680" y2="460" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="930" y1="450" x2="950" y2="450" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="940" y1="440" x2="940" y2="460" stroke="#cc0000" stroke-width="1.5"/>

  <line x1="150" y1="720" x2="170" y2="720" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="160" y1="710" x2="160" y2="730" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="410" y1="720" x2="430" y2="720" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="420" y1="710" x2="420" y2="730" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="670" y1="720" x2="690" y2="720" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="680" y1="710" x2="680" y2="730" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="930" y1="720" x2="950" y2="720" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="940" y1="710" x2="940" y2="730" stroke="#cc0000" stroke-width="1.5"/>

  <!-- ─── TIE BEAMS ─── -->
  <!-- Row 1 horizontal: A1-B1, B1-C1, C1-D1 -->
  <rect x="190" y="153" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="450" y="153" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="710" y="153" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <!-- Row 2 horizontal: A2-B2, B2-C2, C2-D2 -->
  <rect x="190" y="443" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="450" y="443" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="710" y="443" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <!-- Row 3 horizontal: A3-B3, B3-C3, C3-D3 -->
  <rect x="190" y="713" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="450" y="713" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="710" y="713" width="200" height="14" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <!-- Col A vertical: A1-A2, A2-A3 -->
  <rect x="153" y="190" width="14" height="230" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="153" y="460" width="14" height="230" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <!-- Col B vertical -->
  <rect x="413" y="190" width="14" height="230" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="413" y="460" width="14" height="230" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <!-- Col C vertical -->
  <rect x="673" y="190" width="14" height="230" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="673" y="460" width="14" height="230" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <!-- Col D vertical -->
  <rect x="933" y="190" width="14" height="230" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>
  <rect x="933" y="460" width="14" height="230" fill="#c0a080" stroke="#8B4513" stroke-width="1.5" opacity="0.8"/>

  <!-- ─── DIMENSIONS ─── -->
  <!-- Horizontal dimension line at top -->
  <line x1="160" y1="105" x2="420" y2="105" stroke="#2c3e50" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="290" y="100" font-size="9" fill="#2c3e50" text-anchor="middle">2600</text>
  <line x1="420" y1="105" x2="680" y2="105" stroke="#2c3e50" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="550" y="100" font-size="9" fill="#2c3e50" text-anchor="middle">2600</text>
  <line x1="680" y1="105" x2="940" y2="105" stroke="#2c3e50" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="810" y="100" font-size="9" fill="#2c3e50" text-anchor="middle">2600</text>
  <!-- Overall horizontal -->
  <line x1="160" y1="93" x2="940" y2="93" stroke="#2c3e50" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="550" y="89" font-size="10" font-weight="bold" fill="#2c3e50" text-anchor="middle">7800</text>

  <!-- Vertical dimension line -->
  <line x1="1065" y1="160" x2="1065" y2="450" stroke="#2c3e50" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="1085" y="310" font-size="9" fill="#2c3e50" text-anchor="middle" transform="rotate(90,1085,310)">2900</text>
  <line x1="1065" y1="450" x2="1065" y2="720" stroke="#2c3e50" stroke-width="1" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="1085" y="590" font-size="9" fill="#2c3e50" text-anchor="middle" transform="rotate(90,1085,590)">2700</text>
  <!-- Overall vertical -->
  <line x1="1080" y1="160" x2="1080" y2="720" stroke="#2c3e50" stroke-width="1.2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <text x="1100" y="445" font-size="10" font-weight="bold" fill="#2c3e50" text-anchor="middle" transform="rotate(90,1100,445)">5600</text>

  <!-- ─── NORTH ARROW ─── -->
  <g transform="translate(1010,690)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
    <polygon points="0,-24 8,8 0,0 -8,8" fill="#2c3e50"/>
    <polygon points="0,-24 8,8 0,0 -8,8" fill="white" transform="rotate(180)"/>
    <text x="0" y="-30" font-size="10" font-weight="bold" fill="#2c3e50" text-anchor="middle">N</text>
  </g>

  <!-- ─── LEGEND ─── -->
  <g transform="translate(90,530)">
    <text x="0" y="0" font-size="10" font-weight="bold" fill="#2c3e50">LEGEND</text>
    <line x1="0" y1="8" x2="55" y2="8" stroke="#2c3e50" stroke-width="1"/>
    <rect x="0" y="12" width="18" height="12" fill="url(#footing-hatch)" stroke="#8B0000" stroke-width="1.5"/>
    <text x="24" y="22" font-size="9" fill="#2c3e50">Isolated Footing (600×600×300)</text>
    <rect x="0" y="30" width="18" height="12" fill="url(#wall-hatch)" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="24" y="40" font-size="9" fill="#2c3e50">Foundation Wall (300mm thk.)</text>
    <rect x="0" y="48" width="18" height="12" fill="#c0a080" stroke="#8B4513" stroke-width="1"/>
    <text x="24" y="58" font-size="9" fill="#2c3e50">Tie Beam (230×300)</text>
    <line x1="0" y1="72" x2="18" y2="72" stroke="#3498db" stroke-width="1" stroke-dasharray="6,3,2,3"/>
    <text x="24" y="76" font-size="9" fill="#2c3e50">Grid Reference Line</text>
    <line x1="0" y1="87" x2="8" y2="87" stroke="#cc0000" stroke-width="1.5"/>
    <line x1="4" y1="83" x2="4" y2="91" stroke="#cc0000" stroke-width="1.5"/>
    <text x="24" y="91" font-size="9" fill="#2c3e50">Column Centre-Point</text>
  </g>

  <!-- ─── NOTES ─── -->
  <g transform="translate(90,680)">
    <text x="0" y="0" font-size="10" font-weight="bold" fill="#2c3e50">NOTES:</text>
    <text x="0" y="14" font-size="8" fill="#444">1. All footings to bear on firm natural soil (min. 150kN/m²)</text>
    <text x="0" y="26" font-size="8" fill="#444">2. Minimum foundation depth 1200mm below finished ground level</text>
    <text x="0" y="38" font-size="8" fill="#444">3. Concrete: C25/30, Steel: B500</text>
    <text x="0" y="50" font-size="8" fill="#444">4. All dimensions in mm unless noted</text>
    <text x="0" y="62" font-size="8" fill="#444">5. Refer to structural engineer's calculations for reinforcement</text>
  </g>

  <!-- Drawing title overlay -->
  <text x="550" y="800" font-size="16" font-weight="bold" fill="#1a252f" text-anchor="middle" opacity="0.15">FOUNDATION PLAN</text>
</svg>
