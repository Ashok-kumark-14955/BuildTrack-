<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720"
     style="font-family:'Arial',sans-serif;">

  <defs>
    <!-- RC concrete cross-hatch -->
    <pattern id="rc-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#111"/>
      <line x1="0" y1="5" x2="10" y2="5" stroke="#555" stroke-width="1"/>
    </pattern>
    <!-- Soil hatch -->
    <pattern id="soil" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="12" height="12" fill="#1a0d00"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#4a3000" stroke-width="1.5"/>
    </pattern>
    <!-- Blinding concrete -->
    <pattern id="blinding" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0d0d00"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="#333300" stroke-width="0.7"/>
      <line x1="8" y1="0" x2="0" y2="8" stroke="#333300" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#0a0a0a"/>

  <!-- ═══════════════════════════════
       GRID LINES (faint dashed blue)
  ═══════════════════════════════ -->
  <g stroke="#003366" stroke-width="0.8" stroke-dasharray="14,7" opacity="0.8">
    <!-- Vertical grid cols: A=120, B=310, C=500, D=690 -->
    <line x1="120" y1="0" x2="120" y2="720"/>
    <line x1="310" y1="0" x2="310" y2="720"/>
    <line x1="500" y1="0" x2="500" y2="720"/>
    <line x1="690" y1="0" x2="690" y2="720"/>
    <!-- Horizontal grid rows: 1=100, 2=330, 3=560 -->
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="330" x2="900" y2="330"/>
    <line x1="0" y1="560" x2="900" y2="560"/>
  </g>

  <!-- ═══════════════════════════════
       GRID BUBBLE LABELS (circles at top/left)
  ═══════════════════════════════ -->
  <!-- Column labels A B C D -->
  <g fill="none" stroke="#00d4ff" stroke-width="1.5">
    <circle cx="120" cy="30" r="16"/>
    <circle cx="310" cy="30" r="16"/>
    <circle cx="500" cy="30" r="16"/>
    <circle cx="690" cy="30" r="16"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#00d4ff" text-anchor="middle">
    <text x="120" y="35">A</text>
    <text x="310" y="35">B</text>
    <text x="500" y="35">C</text>
    <text x="690" y="35">D</text>
  </g>
  <!-- Row labels 1 2 3 -->
  <g fill="none" stroke="#00d4ff" stroke-width="1.5">
    <circle cx="50" cy="100" r="16"/>
    <circle cx="50" cy="330" r="16"/>
    <circle cx="50" cy="560" r="16"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#00d4ff" text-anchor="middle">
    <text x="50" y="105">1</text>
    <text x="50" y="335">2</text>
    <text x="50" y="565">3</text>
  </g>

  <!-- ═══════════════════════════════
       FOUNDATION SLAB (outer boundary)
  ═══════════════════════════════ -->
  <rect x="80" y="70" width="650" height="560" fill="none" stroke="#00d4ff" stroke-width="3"/>

  <!-- ═══════════════════════════════
       STRIP FOUNDATION WALLS (RC hatch filled, orange border)
  ═══════════════════════════════ -->

  <!-- North strip wall -->
  <rect x="80" y="70" width="650" height="40" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="2"/>
  <!-- South strip wall -->
  <rect x="80" y="590" width="650" height="40" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="2"/>
  <!-- West strip wall -->
  <rect x="80" y="110" width="40" height="480" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="2"/>
  <!-- East strip wall -->
  <rect x="690" y="110" width="40" height="480" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="2"/>

  <!-- Interior cross-walls -->
  <!-- H-wall at y≈315 (partial) -->
  <rect x="120" y="310" width="572" height="40" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="1.5"/>
  <!-- V-wall at x≈310 (partial, top half) -->
  <rect x="290" y="110" width="40" height="200" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="1.5"/>
  <!-- V-wall at x≈500 (partial) -->
  <rect x="480" y="350" width="40" height="240" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="1.5"/>

  <!-- ═══════════════════════════════
       TIE BEAMS (cyan dashed lines connecting footings)
  ═══════════════════════════════ -->
  <g stroke="#00aacc" stroke-width="2" stroke-dasharray="8,4">
    <!-- Row 1 ties -->
    <line x1="120" y1="100" x2="310" y2="100"/>
    <line x1="310" y1="100" x2="500" y2="100"/>
    <line x1="500" y1="100" x2="690" y2="100"/>
    <!-- Row 2 ties -->
    <line x1="120" y1="330" x2="310" y2="330"/>
    <line x1="310" y1="330" x2="500" y2="330"/>
    <line x1="500" y1="330" x2="690" y2="330"/>
    <!-- Row 3 ties -->
    <line x1="120" y1="560" x2="310" y2="560"/>
    <line x1="310" y1="560" x2="500" y2="560"/>
    <line x1="500" y1="560" x2="690" y2="560"/>
    <!-- Col A ties -->
    <line x1="120" y1="100" x2="120" y2="330"/>
    <line x1="120" y1="330" x2="120" y2="560"/>
    <!-- Col B ties -->
    <line x1="310" y1="100" x2="310" y2="330"/>
    <line x1="310" y1="330" x2="310" y2="560"/>
    <!-- Col C ties -->
    <line x1="500" y1="100" x2="500" y2="330"/>
    <line x1="500" y1="330" x2="500" y2="560"/>
    <!-- Col D ties -->
    <line x1="690" y1="100" x2="690" y2="330"/>
    <line x1="690" y1="330" x2="690" y2="560"/>
  </g>

  <!-- ═══════════════════════════════
       ISOLATED PAD FOOTINGS (12 total, 4×3 grid)
       Each: 60×60 square, RC hatch, orange border
  ═══════════════════════════════ -->
  <g fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="2.5">
    <!-- Row 1 -->
    <rect x="90" y="70" width="60" height="60"/>
    <rect x="280" y="70" width="60" height="60"/>
    <rect x="470" y="70" width="60" height="60"/>
    <rect x="660" y="70" width="60" height="60"/>
    <!-- Row 2 -->
    <rect x="90" y="300" width="60" height="60"/>
    <rect x="280" y="300" width="60" height="60"/>
    <rect x="470" y="300" width="60" height="60"/>
    <rect x="660" y="300" width="60" height="60"/>
    <!-- Row 3 -->
    <rect x="90" y="530" width="60" height="60"/>
    <rect x="280" y="530" width="60" height="60"/>
    <rect x="470" y="530" width="60" height="60"/>
    <rect x="660" y="530" width="60" height="60"/>
  </g>

  <!-- Footing center dots -->
  <g fill="#00d4ff">
    <circle cx="120" cy="100" r="4"/>
    <circle cx="310" cy="100" r="4"/>
    <circle cx="500" cy="100" r="4"/>
    <circle cx="690" cy="100" r="4"/>
    <circle cx="120" cy="330" r="4"/>
    <circle cx="310" cy="330" r="4"/>
    <circle cx="500" cy="330" r="4"/>
    <circle cx="690" cy="330" r="4"/>
    <circle cx="120" cy="560" r="4"/>
    <circle cx="310" cy="560" r="4"/>
    <circle cx="500" cy="560" r="4"/>
    <circle cx="690" cy="560" r="4"/>
  </g>

  <!-- Footing labels (column-row codes) -->
  <g font-size="8" fill="#aaddff" text-anchor="middle">
    <text x="120" y="117">PF-A1</text>
    <text x="310" y="117">PF-B1</text>
    <text x="500" y="117">PF-C1</text>
    <text x="690" y="117">PF-D1</text>
    <text x="120" y="347">PF-A2</text>
    <text x="310" y="347">PF-B2</text>
    <text x="500" y="347">PF-C2</text>
    <text x="690" y="347">PF-D2</text>
    <text x="120" y="577">PF-A3</text>
    <text x="310" y="577">PF-B3</text>
    <text x="500" y="577">PF-C3</text>
    <text x="690" y="577">PF-D3</text>
  </g>

  <!-- ═══════════════════════════════
       SECTION CALLOUT A-A
  ═══════════════════════════════ -->
  <line x1="780" y1="70" x2="780" y2="630" stroke="#ffff00" stroke-width="1.5" stroke-dasharray="6,3"/>
  <circle cx="780" cy="55" r="14" fill="none" stroke="#ffff00" stroke-width="1.5"/>
  <text x="780" y="60" font-size="11" fill="#ffff00" text-anchor="middle" font-weight="bold">A</text>
  <circle cx="780" cy="645" r="14" fill="none" stroke="#ffff00" stroke-width="1.5"/>
  <text x="780" y="650" font-size="11" fill="#ffff00" text-anchor="middle" font-weight="bold">A</text>

  <!-- ═══════════════════════════════
       FOOTING SECTION DETAIL (bottom-right inset)
  ═══════════════════════════════ -->
  <rect x="790" y="70" width="100" height="260" fill="#080808" stroke="#555" stroke-width="1"/>
  <text x="840" y="85" font-size="8" fill="#888" text-anchor="middle">SECTION A-A</text>
  <text x="840" y="95" font-size="7" fill="#666" text-anchor="middle">600×600×300 PAD</text>
  <!-- Ground level line -->
  <line x1="790" y1="145" x2="890" y2="145" stroke="#884400" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="795" y="142" font-size="7" fill="#884400">GL</text>
  <!-- Soil hatch -->
  <rect x="790" y="145" width="100" height="60" fill="url(#soil)"/>
  <!-- Blinding layer -->
  <rect x="800" y="185" width="80" height="10" fill="url(#blinding)" stroke="#666" stroke-width="1"/>
  <text x="840" y="193" font-size="6.5" fill="#999" text-anchor="middle">75 BLINDING</text>
  <!-- Footing body RC -->
  <rect x="800" y="195" width="80" height="50" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="1.5"/>
  <!-- Rebar lines -->
  <g stroke="#ff6600" stroke-width="1">
    <line x1="810" y1="215" x2="870" y2="215"/>
    <line x1="810" y1="225" x2="870" y2="225"/>
    <line x1="825" y1="198" x2="825" y2="243"/>
    <line x1="855" y1="198" x2="855" y2="243"/>
  </g>
  <!-- Rebar size label -->
  <text x="840" y="258" font-size="7" fill="#ff8800" text-anchor="middle">T16 @ 150 EW</text>
  <!-- Column stub -->
  <rect x="828" y="148" width="24" height="47" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="1.5"/>
  <text x="840" y="135" font-size="7" fill="#aaddff" text-anchor="middle">300×300 COL</text>

  <!-- ═══════════════════════════════
       NORTH ARROW
  ═══════════════════════════════ -->
  <g transform="translate(835,500)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#555" stroke-width="1"/>
    <polygon points="0,-18 -6,8 0,4 6,8" fill="#00d4ff"/>
    <polygon points="0,-18 -6,8 0,4 6,8" fill="#333" transform="rotate(180)"/>
    <text x="0" y="-24" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">N</text>
  </g>

  <!-- ═══════════════════════════════
       SCALE BAR
  ═══════════════════════════════ -->
  <g transform="translate(790,570)">
    <text x="0" y="-4" font-size="8" fill="#888">SCALE 1:100</text>
    <rect x="0" y="0" width="25" height="8" fill="#00d4ff"/>
    <rect x="25" y="0" width="25" height="8" fill="#0a0a0a" stroke="#00d4ff" stroke-width="1"/>
    <rect x="50" y="0" width="25" height="8" fill="#00d4ff"/>
    <text x="0" y="18" font-size="7" fill="#888">0</text>
    <text x="23" y="18" font-size="7" fill="#888">1m</text>
    <text x="47" y="18" font-size="7" fill="#888">2m</text>
    <text x="73" y="18" font-size="7" fill="#888">3m</text>
  </g>

  <!-- ═══════════════════════════════
       DIMENSION STRINGS
  ═══════════════════════════════ -->
  <!-- Top horizontal: A→B, B→C, C→D -->
  <g stroke="#888" stroke-width="0.8" fill="#888" font-size="8">
    <!-- Extension lines -->
    <line x1="120" y1="55" x2="120" y2="46"/>
    <line x1="310" y1="55" x2="310" y2="46"/>
    <line x1="500" y1="55" x2="500" y2="46"/>
    <line x1="690" y1="55" x2="690" y2="46"/>
    <!-- Dim lines -->
    <line x1="120" y1="46" x2="310" y2="46"/>
    <line x1="310" y1="46" x2="500" y2="46"/>
    <line x1="500" y1="46" x2="690" y2="46"/>
    <!-- Arrows -->
    <polygon points="120,46 130,43 130,49" fill="#888"/>
    <polygon points="310,46 300,43 300,49" fill="#888"/>
    <polygon points="310,46 320,43 320,49" fill="#888"/>
    <polygon points="500,46 490,43 490,49" fill="#888"/>
    <polygon points="500,46 510,43 510,49" fill="#888"/>
    <polygon points="690,46 680,43 680,49" fill="#888"/>
    <!-- Labels -->
    <text x="215" y="43" text-anchor="middle">2800</text>
    <text x="405" y="43" text-anchor="middle">2800</text>
    <text x="595" y="43" text-anchor="middle">2800</text>
  </g>

  <!-- Left vertical: row 1→2, 2→3 -->
  <g stroke="#888" stroke-width="0.8" fill="#888" font-size="8">
    <line x1="68" y1="100" x2="60" y2="100"/>
    <line x1="68" y1="330" x2="60" y2="330"/>
    <line x1="68" y1="560" x2="60" y2="560"/>
    <line x1="60" y1="100" x2="60" y2="330"/>
    <line x1="60" y1="330" x2="60" y2="560"/>
    <polygon points="60,100 57,110 63,110" fill="#888"/>
    <polygon points="60,330 57,320 63,320" fill="#888"/>
    <polygon points="60,330 57,340 63,340" fill="#888"/>
    <polygon points="60,560 57,550 63,550" fill="#888"/>
    <text x="55" y="222" text-anchor="middle" transform="rotate(-90,55,222)">2800</text>
    <text x="55" y="450" text-anchor="middle" transform="rotate(-90,55,450)">2800</text>
  </g>

  <!-- ═══════════════════════════════
       LEGEND
  ═══════════════════════════════ -->
  <rect x="790" y="330" width="100" height="120" fill="#0d0d0d" stroke="#444" stroke-width="1"/>
  <text x="840" y="346" font-size="8" fill="#aaa" text-anchor="middle" font-weight="bold">LEGEND</text>
  <rect x="796" y="352" width="14" height="10" fill="url(#rc-hatch)" stroke="#d4640a" stroke-width="1"/>
  <text x="814" y="361" font-size="7.5" fill="#ccc">RC Concrete</text>
  <rect x="796" y="368" width="14" height="10" fill="url(#soil)"/>
  <text x="814" y="377" font-size="7.5" fill="#ccc">Soil/Fill</text>
  <line x1="796" y1="389" x2="810" y2="389" stroke="#00aacc" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="814" y="393" font-size="7.5" fill="#ccc">Tie Beam</text>
  <line x1="796" y1="405" x2="810" y2="405" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="814" y="409" font-size="7.5" fill="#ccc">Grid Line</text>
  <circle cx="803" cy="423" r="4" fill="#00d4ff"/>
  <text x="814" y="427" font-size="7.5" fill="#ccc">Col Centre</text>
  <text x="814" y="443" font-size="7.5" fill="#888">BS EN 1997-1</text>

  <!-- ═══════════════════════════════
       TITLE BLOCK
  ═══════════════════════════════ -->
  <rect x="80" y="655" width="695" height="55" fill="#0d0d0d" stroke="#555" stroke-width="1"/>
  <line x1="80" y1="670" x2="775" y2="670" stroke="#555" stroke-width="0.7"/>
  <line x1="300" y1="655" x2="300" y2="710" stroke="#555" stroke-width="0.7"/>
  <line x1="550" y1="655" x2="550" y2="710" stroke="#555" stroke-width="0.7"/>
  <text x="190" y="664" font-size="8" fill="#888" text-anchor="middle">PROJECT</text>
  <text x="190" y="678" font-size="10" fill="white" text-anchor="middle" font-weight="bold">RESIDENTIAL BUILDING</text>
  <text x="190" y="695" font-size="8" fill="#aaa" text-anchor="middle">Two-Unit Dwelling</text>
  <text x="425" y="664" font-size="8" fill="#888" text-anchor="middle">DRAWING TITLE</text>
  <text x="425" y="678" font-size="10" fill="#00d4ff" text-anchor="middle" font-weight="bold">FOUNDATION PLAN</text>
  <text x="425" y="695" font-size="8" fill="#aaa" text-anchor="middle">ST-FP-001 | Sheet 1 of 3</text>
  <text x="662" y="664" font-size="8" fill="#888" text-anchor="middle">SCALE / DATE</text>
  <text x="662" y="678" font-size="9" fill="white" text-anchor="middle">1:100</text>
  <text x="662" y="693" font-size="8" fill="#888" text-anchor="middle">Rev A | 2026</text>

</svg>
