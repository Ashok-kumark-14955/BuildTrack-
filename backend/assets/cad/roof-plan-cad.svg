<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     style="background:#f8f8f2;font-family:'Courier New',monospace;">

  <!-- ═══════════════════════════════════════════════════════════════
       ROOF PLAN — HOUSE BUILDING PROJECT
       Grid: 4 columns (A–D) × 3 rows (1–3)
       Scale: 1:100  |  All dimensions in mm
       ═══════════════════════════════════════════════════════════════ -->

  <defs>
    <pattern id="rp-grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10,0 L0,0 0,10" fill="none" stroke="#d8d8c8" stroke-width="0.25"/>
    </pattern>
    <pattern id="rp-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#rp-grid-fine)"/>
      <path d="M100,0 L0,0 0,100" fill="none" stroke="#c0bea8" stroke-width="0.7"/>
    </pattern>
    <marker id="rp-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a252f"/>
    </marker>
    <marker id="rp-arrow-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#1a252f"/>
    </marker>
    <!-- Roof tile hatch -->
    <pattern id="roof-tile" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="20" height="12" fill="none"/>
      <path d="M0,6 Q5,0 10,6 Q15,12 20,6" fill="none" stroke="#c08060" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <!-- Flat roof hatch -->
    <pattern id="flat-roof" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="12" x2="12" y2="0" stroke="#a08870" stroke-width="0.6" opacity="0.7"/>
    </pattern>
    <!-- Ridge direction hatching -->
    <pattern id="slope-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9a8870" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <pattern id="wall-fill-rp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a7a60" stroke-width="1.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f8f2"/>
  <rect x="80" y="80" width="1040" height="760" fill="url(#rp-grid-major)" opacity="0.45"/>

  <!-- ─── TITLE BLOCK ─── -->
  <rect x="80" y="820" width="1040" height="60" fill="#e4e4d4" stroke="#1a252f" stroke-width="1.5"/>
  <line x1="400" y1="820" x2="400" y2="880" stroke="#1a252f" stroke-width="1"/>
  <line x1="700" y1="820" x2="700" y2="880" stroke="#1a252f" stroke-width="1"/>
  <line x1="900" y1="820" x2="900" y2="880" stroke="#1a252f" stroke-width="1"/>
  <text x="240" y="843" font-size="11" font-weight="bold" fill="#1a252f" text-anchor="middle">PROJECT: HOUSE BUILDING</text>
  <text x="240" y="860" font-size="10" fill="#444" text-anchor="middle">Client: Residential Development</text>
  <text x="550" y="843" font-size="14" font-weight="bold" fill="#0d1b2a" text-anchor="middle">ROOF PLAN</text>
  <text x="550" y="861" font-size="10" fill="#444" text-anchor="middle">Drawing No: RP-001 | Rev: A</text>
  <text x="800" y="843" font-size="10" fill="#1a252f" text-anchor="middle">Scale: 1:100 | Units: mm</text>
  <text x="800" y="861" font-size="10" fill="#444" text-anchor="middle">Roof Pitch: 25°</text>
  <text x="1000" y="843" font-size="10" fill="#1a252f" text-anchor="middle">Date: 2026-09-08</text>
  <text x="1000" y="861" font-size="10" fill="#444" text-anchor="middle">Sheet: 3 of 3</text>

  <!-- Border -->
  <rect x="80" y="80" width="1040" height="740" fill="none" stroke="#1a252f" stroke-width="2"/>

  <!-- ─── GRID LINES ─── -->
  <!-- Columns: A=160, B=420, C=680, D=940  Rows: 1=160, 2=450, 3=720 -->
  <line x1="160" y1="120" x2="160" y2="760" stroke="#2980b9" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.5"/>
  <line x1="420" y1="120" x2="420" y2="760" stroke="#2980b9" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.5"/>
  <line x1="680" y1="120" x2="680" y2="760" stroke="#2980b9" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.5"/>
  <line x1="940" y1="120" x2="940" y2="760" stroke="#2980b9" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.5"/>

  <line x1="100" y1="160" x2="1060" y2="160" stroke="#2980b9" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.5"/>
  <line x1="100" y1="450" x2="1060" y2="450" stroke="#2980b9" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.5"/>
  <line x1="100" y1="720" x2="1060" y2="720" stroke="#2980b9" stroke-width="0.8" stroke-dasharray="12,6,3,6" opacity="0.5"/>

  <!-- ─── GRID BUBBLES ─── -->
  <circle cx="160" cy="130" r="14" fill="#fff" stroke="#1a252f" stroke-width="1.5"/>
  <text x="160" y="135" font-size="12" font-weight="bold" fill="#1a252f" text-anchor="middle">A</text>
  <circle cx="420" cy="130" r="14" fill="#fff" stroke="#1a252f" stroke-width="1.5"/>
  <text x="420" y="135" font-size="12" font-weight="bold" fill="#1a252f" text-anchor="middle">B</text>
  <circle cx="680" cy="130" r="14" fill="#fff" stroke="#1a252f" stroke-width="1.5"/>
  <text x="680" y="135" font-size="12" font-weight="bold" fill="#1a252f" text-anchor="middle">C</text>
  <circle cx="940" cy="130" r="14" fill="#fff" stroke="#1a252f" stroke-width="1.5"/>
  <text x="940" y="135" font-size="12" font-weight="bold" fill="#1a252f" text-anchor="middle">D</text>

  <circle cx="110" cy="160" r="14" fill="#fff" stroke="#1a252f" stroke-width="1.5"/>
  <text x="110" y="165" font-size="12" font-weight="bold" fill="#1a252f" text-anchor="middle">1</text>
  <circle cx="110" cy="450" r="14" fill="#fff" stroke="#1a252f" stroke-width="1.5"/>
  <text x="110" y="455" font-size="12" font-weight="bold" fill="#1a252f" text-anchor="middle">2</text>
  <circle cx="110" cy="720" r="14" fill="#fff" stroke="#1a252f" stroke-width="1.5"/>
  <text x="110" y="725" font-size="12" font-weight="bold" fill="#1a252f" text-anchor="middle">3</text>

  <!-- ─── BUILDING OUTLINE (wall plates at roof level) ─── -->
  <!-- Main building footprint outline (double line for wall thickness) -->
  <rect x="145" y="145" width="810" height="590" fill="none" stroke="#5a4a3a" stroke-width="3"/>
  <rect x="155" y="155" width="790" height="570" fill="none" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="8,4"/>

  <!-- ─── MAIN PITCHED ROOF (gable roof A1-D1 to A3-D3) ─── -->
  <!-- Left pitch panel: A1-B ridge -->
  <polygon points="160,160 550,305 160,725" fill="url(#roof-tile)" stroke="#8B5E3C" stroke-width="1.5" opacity="0.75"/>
  <!-- Right pitch panel: D1-C ridge -->
  <polygon points="940,160 550,305 940,725" fill="url(#roof-tile)" stroke="#8B5E3C" stroke-width="1.5" opacity="0.75"/>
  <!-- Front gable: A1-D1 top -->
  <polygon points="160,160 940,160 550,305" fill="#d4a882" stroke="#8B5E3C" stroke-width="1.8" opacity="0.55"/>
  <!-- Rear gable: A3-D3 bottom -->
  <polygon points="160,725 940,725 550,580" fill="#d4a882" stroke="#8B5E3C" stroke-width="1.8" opacity="0.55"/>

  <!-- ─── RIDGE LINES ─── -->
  <!-- Main ridge (horizontal, at roof apex) -->
  <line x1="550" y1="305" x2="550" y2="580" stroke="#5a2800" stroke-width="3.5" stroke-linecap="round"/>
  <text x="570" y="448" font-size="9" font-weight="bold" fill="#5a2800" text-anchor="start">RIDGE</text>

  <!-- ─── HIP ENDS ─── -->
  <!-- Front hip: corners A1,D1 → ridge ends -->
  <line x1="160" y1="160" x2="550" y2="305" stroke="#7a3a10" stroke-width="2" stroke-dasharray="8,3"/>
  <line x1="940" y1="160" x2="550" y2="305" stroke="#7a3a10" stroke-width="2" stroke-dasharray="8,3"/>
  <!-- Rear hip -->
  <line x1="160" y1="725" x2="550" y2="580" stroke="#7a3a10" stroke-width="2" stroke-dasharray="8,3"/>
  <line x1="940" y1="725" x2="550" y2="580" stroke="#7a3a10" stroke-width="2" stroke-dasharray="8,3"/>

  <!-- ─── EAVES LINES (at the perimeter) ─── -->
  <!-- Overhang dashed outline: 400mm overhang at 1:100 = 4px each side -->
  <rect x="100" y="100" width="920" height="700" fill="none" stroke="#b08060" stroke-width="1.2" stroke-dasharray="10,5" opacity="0.6"/>
  <text x="550" y="97" font-size="8" fill="#b08060" text-anchor="middle">EAVES LINE (400mm overhang)</text>

  <!-- ─── VALLEY / FLAT ROOF SECTION (B2-C3 dormer extension) ─── -->
  <rect x="390" y="420" width="310" height="300" fill="url(#flat-roof)" stroke="#6a5a40" stroke-width="1.8" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="545" y="570" font-size="9" font-weight="bold" fill="#6a5a40" text-anchor="middle">FLAT ROOF</text>
  <text x="545" y="582" font-size="8" fill="#6a5a40" text-anchor="middle">EXTENSION</text>
  <text x="545" y="594" font-size="8" fill="#6a5a40" text-anchor="middle">FALLS TO DRAIN</text>

  <!-- ─── ROOF DRAINAGE ─── -->
  <!-- Down pipes -->
  <circle cx="160" cy="160" r="8" fill="#4a7a9b" stroke="#1a5276" stroke-width="1.5"/>
  <text x="160" y="163" font-size="7" fill="white" text-anchor="middle">DP</text>
  <circle cx="940" cy="160" r="8" fill="#4a7a9b" stroke="#1a5276" stroke-width="1.5"/>
  <text x="940" y="163" font-size="7" fill="white" text-anchor="middle">DP</text>
  <circle cx="160" cy="720" r="8" fill="#4a7a9b" stroke="#1a5276" stroke-width="1.5"/>
  <text x="160" y="723" font-size="7" fill="white" text-anchor="middle">DP</text>
  <circle cx="940" cy="720" r="8" fill="#4a7a9b" stroke="#1a5276" stroke-width="1.5"/>
  <text x="940" y="723" font-size="7" fill="white" text-anchor="middle">DP</text>

  <!-- Gutter line -->
  <line x1="160" y1="148" x2="940" y2="148" stroke="#4a7a9b" stroke-width="2.5" opacity="0.7"/>
  <line x1="160" y1="730" x2="940" y2="730" stroke="#4a7a9b" stroke-width="2.5" opacity="0.7"/>
  <line x1="148" y1="160" x2="148" y2="725" stroke="#4a7a9b" stroke-width="2.5" opacity="0.7"/>
  <line x1="952" y1="160" x2="952" y2="725" stroke="#4a7a9b" stroke-width="2.5" opacity="0.7"/>

  <!-- ─── ROOF SLOPE ARROWS ─── -->
  <line x1="340" y1="350" x2="210" y2="390" stroke="#c0392b" stroke-width="1.2" marker-end="url(#rp-arrow)"/>
  <text x="330" y="345" font-size="8" fill="#c0392b" text-anchor="middle">25°</text>
  <line x1="760" y1="350" x2="890" y2="390" stroke="#c0392b" stroke-width="1.2" marker-end="url(#rp-arrow)"/>
  <text x="770" y="345" font-size="8" fill="#c0392b" text-anchor="middle">25°</text>
  <line x1="340" y1="600" x2="210" y2="570" stroke="#c0392b" stroke-width="1.2" marker-end="url(#rp-arrow)"/>
  <line x1="760" y1="600" x2="890" y2="570" stroke="#c0392b" stroke-width="1.2" marker-end="url(#rp-arrow)"/>

  <!-- ─── COLUMN MARKERS ─── -->
  <!-- Row 1: y=160 -->
  <line x1="152" y1="160" x2="168" y2="160" stroke="#cc0000" stroke-width="1.5"/><line x1="160" y1="152" x2="160" y2="168" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="412" y1="160" x2="428" y2="160" stroke="#cc0000" stroke-width="1.5"/><line x1="420" y1="152" x2="420" y2="168" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="672" y1="160" x2="688" y2="160" stroke="#cc0000" stroke-width="1.5"/><line x1="680" y1="152" x2="680" y2="168" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="932" y1="160" x2="948" y2="160" stroke="#cc0000" stroke-width="1.5"/><line x1="940" y1="152" x2="940" y2="168" stroke="#cc0000" stroke-width="1.5"/>
  <!-- Row 2: y=450 -->
  <line x1="152" y1="450" x2="168" y2="450" stroke="#cc0000" stroke-width="1.5"/><line x1="160" y1="442" x2="160" y2="458" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="412" y1="450" x2="428" y2="450" stroke="#cc0000" stroke-width="1.5"/><line x1="420" y1="442" x2="420" y2="458" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="672" y1="450" x2="688" y2="450" stroke="#cc0000" stroke-width="1.5"/><line x1="680" y1="442" x2="680" y2="458" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="932" y1="450" x2="948" y2="450" stroke="#cc0000" stroke-width="1.5"/><line x1="940" y1="442" x2="940" y2="458" stroke="#cc0000" stroke-width="1.5"/>
  <!-- Row 3: y=720 -->
  <line x1="152" y1="720" x2="168" y2="720" stroke="#cc0000" stroke-width="1.5"/><line x1="160" y1="712" x2="160" y2="728" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="412" y1="720" x2="428" y2="720" stroke="#cc0000" stroke-width="1.5"/><line x1="420" y1="712" x2="420" y2="728" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="672" y1="720" x2="688" y2="720" stroke="#cc0000" stroke-width="1.5"/><line x1="680" y1="712" x2="680" y2="728" stroke="#cc0000" stroke-width="1.5"/>
  <line x1="932" y1="720" x2="948" y2="720" stroke="#cc0000" stroke-width="1.5"/><line x1="940" y1="712" x2="940" y2="728" stroke="#cc0000" stroke-width="1.5"/>

  <!-- ─── DIMENSIONS ─── -->
  <line x1="160" y1="108" x2="420" y2="108" stroke="#1a252f" stroke-width="1" marker-start="url(#rp-arrow-rev)" marker-end="url(#rp-arrow)"/>
  <text x="290" y="104" font-size="9" fill="#1a252f" text-anchor="middle">2600</text>
  <line x1="420" y1="108" x2="680" y2="108" stroke="#1a252f" stroke-width="1" marker-start="url(#rp-arrow-rev)" marker-end="url(#rp-arrow)"/>
  <text x="550" y="104" font-size="9" fill="#1a252f" text-anchor="middle">2600</text>
  <line x1="680" y1="108" x2="940" y2="108" stroke="#1a252f" stroke-width="1" marker-start="url(#rp-arrow-rev)" marker-end="url(#rp-arrow)"/>
  <text x="810" y="104" font-size="9" fill="#1a252f" text-anchor="middle">2600</text>
  <line x1="160" y1="95" x2="940" y2="95" stroke="#1a252f" stroke-width="1.3" marker-start="url(#rp-arrow-rev)" marker-end="url(#rp-arrow)"/>
  <text x="550" y="91" font-size="10" font-weight="bold" fill="#1a252f" text-anchor="middle">7800</text>

  <line x1="1060" y1="160" x2="1060" y2="450" stroke="#1a252f" stroke-width="1" marker-start="url(#rp-arrow-rev)" marker-end="url(#rp-arrow)"/>
  <text x="1078" y="308" font-size="9" fill="#1a252f" text-anchor="middle" transform="rotate(90,1078,308)">2900</text>
  <line x1="1060" y1="450" x2="1060" y2="720" stroke="#1a252f" stroke-width="1" marker-start="url(#rp-arrow-rev)" marker-end="url(#rp-arrow)"/>
  <text x="1078" y="588" font-size="9" fill="#1a252f" text-anchor="middle" transform="rotate(90,1078,588)">2700</text>
  <line x1="1077" y1="160" x2="1077" y2="720" stroke="#1a252f" stroke-width="1.3" marker-start="url(#rp-arrow-rev)" marker-end="url(#rp-arrow)"/>
  <text x="1097" y="443" font-size="10" font-weight="bold" fill="#1a252f" text-anchor="middle" transform="rotate(90,1097,443)">5600</text>

  <!-- Ridge height callout -->
  <line x1="550" y1="160" x2="550" y2="305" stroke="#8B2500" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#rp-arrow)"/>
  <text x="560" y="240" font-size="9" fill="#8B2500">H=1950</text>
  <text x="560" y="252" font-size="8" fill="#8B2500">(ridge ht.)</text>

  <!-- ─── NORTH ARROW ─── -->
  <g transform="translate(200,660)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#1a252f" stroke-width="1.5"/>
    <polygon points="0,-22 7,7 0,0 -7,7" fill="#1a252f"/>
    <polygon points="0,-22 7,7 0,0 -7,7" fill="white" transform="rotate(180)"/>
    <text x="0" y="-28" font-size="10" font-weight="bold" fill="#1a252f" text-anchor="middle">N</text>
  </g>

  <!-- ─── LEGEND ─── -->
  <g transform="translate(88,560)">
    <text x="0" y="0" font-size="10" font-weight="bold" fill="#1a252f">LEGEND</text>
    <line x1="0" y1="5" x2="55" y2="5" stroke="#1a252f" stroke-width="0.8"/>
    <rect x="0" y="9" width="18" height="11" fill="url(#roof-tile)" stroke="#8B5E3C" stroke-width="1"/>
    <text x="23" y="19" font-size="8.5" fill="#1a252f">Pitched Clay Tile Roof (25°)</text>
    <rect x="0" y="25" width="18" height="11" fill="url(#flat-roof)" stroke="#6a5a40" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="23" y="35" font-size="8.5" fill="#1a252f">Flat Roof Extension</text>
    <line x1="0" y1="47" x2="18" y2="47" stroke="#5a2800" stroke-width="3"/>
    <text x="23" y="51" font-size="8.5" fill="#1a252f">Ridge Line</text>
    <line x1="0" y1="61" x2="18" y2="61" stroke="#7a3a10" stroke-width="1.5" stroke-dasharray="5,2"/>
    <text x="23" y="65" font-size="8.5" fill="#1a252f">Hip / Valley Line</text>
    <line x1="0" y1="75" x2="18" y2="75" stroke="#b08060" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="23" y="79" font-size="8.5" fill="#1a252f">Eaves Line (400mm overhang)</text>
    <line x1="0" y1="89" x2="18" y2="89" stroke="#4a7a9b" stroke-width="2"/>
    <text x="23" y="93" font-size="8.5" fill="#1a252f">Gutters</text>
    <circle cx="9" cy="103" r="6" fill="#4a7a9b" stroke="#1a5276" stroke-width="1"/>
    <text x="9" y="106" font-size="6" fill="white" text-anchor="middle">DP</text>
    <text x="23" y="107" font-size="8.5" fill="#1a252f">Downpipe (100mm dia.)</text>
    <line x1="0" y1="116" x2="8" y2="116" stroke="#cc0000" stroke-width="1.5"/><line x1="4" y1="112" x2="4" y2="120" stroke="#cc0000" stroke-width="1.5"/>
    <text x="23" y="120" font-size="8.5" fill="#1a252f">Column / Wall Plate Point</text>
  </g>

  <!-- ─── NOTES ─── -->
  <g transform="translate(88,700)">
    <text x="0" y="0" font-size="10" font-weight="bold" fill="#1a252f">NOTES:</text>
    <text x="0" y="13" font-size="8" fill="#444">1. Roof tiles: clay pantile, min. 150mm headlap</text>
    <text x="0" y="25" font-size="8" fill="#444">2. Flat roof: built-up felt, 50mm insulation, falls ≥1:80</text>
    <text x="0" y="37" font-size="8" fill="#444">3. All eaves overhangs = 400mm unless noted</text>
    <text x="0" y="49" font-size="8" fill="#444">4. Gutters: 100mm PVC half-round</text>
    <text x="0" y="61" font-size="8" fill="#444">5. Ridge height = 1950mm above wall plate</text>
    <text x="0" y="73" font-size="8" fill="#444">6. Roof pitch = 25° (4.66:12)</text>
  </g>

  <!-- Watermark -->
  <text x="550" y="805" font-size="14" font-weight="bold" fill="#1a252f" text-anchor="middle" opacity="0.1">ROOF PLAN</text>
</svg>
